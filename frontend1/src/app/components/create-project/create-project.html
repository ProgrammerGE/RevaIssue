<button id="create_projec_btn" class="add-button" title="Add new" (click)="addPopup()">
   <img src="assets/icons/plus.svg" />
</button>
@if (isPoppedUp()){
  <app-popup-wrapper [(isPopupActive)]="isPoppedUp">
    <div class="parent">
  <div class="proj_name">
    @if (titleMissing) {
    <h4 style="color: red">Enter a title name for the project</h4>
    }
    <label for="proj_title">Project Name</label>
    <input id="proj_title" type="text" placeholder="Project Title" [(ngModel)]="projectTitle" />
  </div>
  <div class="proj_description">
    @if (descriptionMissing) {
    <h4 style="color: red">Enter a description</h4>
    }
    <label for="descriptionBox">Project Description</label>
    <textarea
      type="text"
      placeholder="Project Description"
      id="descriptionBox"
      [(ngModel)]="projectDesc"
      rows="10"
    ></textarea>
  </div>
  <div class="create-project-button-container">
    <button id="create_confirm" (click)="createProject()">{{ buttonText }}</button>
    <button id="cancel_btn" (click)="cancelCreation()">{{ buttonCancel }}</button>
  </div>
</div>
  </app-popup-wrapper>
}
