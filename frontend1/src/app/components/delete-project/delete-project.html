<app-popup-wrapper>
  <div class="parent">
    <div class="proj_warning">
      <h4 style="color: red">Are you sure you want to delete: {{projectName}}</h4>
    </div>
    <div class="deletion_buttons">
      <button id="delete_confirm" (click)="clickConfirm()">Delete</button>
      <button id="cancel_btn" (click)="clickCancel()">Cancel</button>
    </div>
  </div>
</app-popup-wrapper>
